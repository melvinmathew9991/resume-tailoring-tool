[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-tailor"
version = "2.0.0"
description = "Tailor a resume against a job description from a bank of pre-verified project content."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Melvin Mathew" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "Jinja2>=3.1",
    "pypdf>=4.2",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
# Deliberately not in `dev`: mutmut refuses to run on native Windows
# (boxed/mutmut#397), and this project's development machine is Windows.
# Putting it in `dev` would mean every local setup installs a tool that
# immediately errors out. It is a Linux/CI extra.
mutation = ["mutmut>=3.0"]

[project.scripts]
resume-tailor-api = "resume_tailor.api.main:run"

[tool.setuptools]
include-package-data = true

# Two roots: the library under src/, and the Streamlit frontend at the repo
# root. `ui` is installed rather than reached via a sys.path hack because
# Streamlit executes the entrypoint with only its own directory on sys.path,
# so `from ui import components` fails otherwise.
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["resume_tailor*", "ui*"]

[tool.setuptools.package-data]
resume_tailor = ["render/templates/*.j2", "py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:resume_tailor.*"]
markers = [
    "unit: pure-function tests, no I/O, milliseconds",
    "property: hypothesis-driven invariant tests",
    "security: hostile-input / injection tests",
    "api: FastAPI TestClient tests against the full app (fake PDF engine)",
    "ui: Streamlit AppTest tests",
    "integration: requires a real PDF engine (tectonic or pdflatex)",
    "latex: requires a real LaTeX toolchain on PATH",
    "slow: takes more than a couple of seconds",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["resume_tailor"]
branch = true
omit = []

[tool.coverage.report]
precision = 1
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

# ---------------------------------------------------------------------------
# mutation testing
#
# Scoped to domain/ on purpose. Those two modules are where a bug is silent:
# a botched escape or a mis-scored keyword produces a plausible-looking resume
# rather than an exception, so "the tests executed this line" is a much weaker
# claim there than "the tests would fail if this line were wrong".
# ---------------------------------------------------------------------------
# The runner names its test files explicitly. Without paths, pytest falls back
# to `testpaths = ["tests"]` above and runs the entire suite -- api, ui,
# streamlit startup, hypothesis -- once per mutant. With hundreds of mutants
# that is hours of compute to learn something about two pure modules. These
# four targets are the ones that actually constrain domain/, and `-x` stops
# each run at the first failure, which is all a mutant needs to be killed.
#
# `also_copy` is required, not optional: mutmut runs the suite from a `mutants/`
# copy of the project, and `tests/conftest.py` resolves the real project bank
# relative to the repository root. Without the data directory in that copy,
# every mutant run dies collecting `real_bank` with a BankError -- which mutmut
# reports as "failed to collect stats", not as a missing file.
[tool.mutmut]
paths_to_mutate = ["src/resume_tailor/domain/"]
tests_dir = ["tests/unit/", "tests/security/"]
also_copy = ["data/"]
runner = "python -m pytest -x -q --assert=plain -p no:cacheprovider tests/unit/test_latex.py tests/unit/test_matching.py tests/unit/test_models.py tests/security/test_injection.py"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "ui", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "S",        # bandit
]
ignore = [
    "E501",    # line length is handled by the formatter
    "S101",    # assert is fine in tests
    "B008",    # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"src/resume_tailor/render/engines/*" = ["S603", "S607"]  # subprocess calls are the point
"tasks.py" = ["S603", "S607"]  # a task runner invoking fixed developer commands

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src", "ui"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "pypdf.*"]
ignore_missing_imports = true

# Transitive dependencies of streamlit that ship their own type stubs, so mypy
# follows into them and type-checks third-party code we do not import directly.
#
# That is not just wasted work, it is a portability trap. `python_version` above
# is 3.10, this project's `requires-python` floor. Run mypy on a *newer*
# interpreter and pip resolves a different dependency set than the one being
# asserted about: on 3.12 that is a numpy whose stubs use `type` statements,
# 3.12-only syntax, which mypy parses under 3.10 rules and rejects -- a syntax
# error in a file nobody here wrote, and one that cannot reproduce on 3.10.
#
# The primary fix is that CI type-checks on 3.10 (see .github/workflows/ci.yml).
# This override is the belt-and-braces half, for anyone running mypy on a newer
# local interpreter. Both the bare name and the wildcard are listed: the
# wildcard alone does not reliably match the top-level package itself, which is
# exactly where numpy's offending stub lives.
[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
    "altair",
    "altair.*",
]
follow_imports = "skip"
ignore_missing_imports = true
