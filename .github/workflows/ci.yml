name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # nightly: the expensive real-toolchain job

# `github.event_name` is in the key on purpose. Without it a manual
# workflow_dispatch shares a bucket with the push run for the same ref and
# cancels it -- which is exactly what happened to the push runs for the last two
# commits on main: both died at 2-3 seconds, and only the nightly schedule ever
# tested them. Pull requests still cancel their own superseded runs, which is
# the case cancel-in-progress is actually worth having.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # The suite that must stay green everywhere, on every push. No LaTeX
  # toolchain: the fake PDF engine covers the whole page-fit pipeline, which is
  # what makes this job fast enough to run on three Python versions and three
  # operating systems.
  fast:
    name: fast (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          - python: "3.12"
            os: windows-latest
          - python: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - name: Run the fast suite with the coverage gate
        run: pytest -m "not integration and not latex and not slow" --cov=resume_tailor --cov=ui --cov-report=term-missing --cov-report=xml
      # Surfaced in the run summary rather than only uploaded. The XML was
      # published as an artifact that nothing consumed -- no Codecov step, no
      # diff-coverage check, no annotation -- so the number was only ever
      # visible to someone who downloaded the file and opened it.
      - name: Report coverage in the run summary
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python .github/scripts/coverage_summary.py coverage.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 3.10 on purpose: it is this project's `requires-python` floor and what
      # `python_version` in [tool.mypy] is pinned to. Type-checking the floor
      # on a newer interpreter resolves a different dependency set than the one
      # being asserted about -- on 3.12 that meant a numpy whose stubs use
      # 3.12-only `type` statements, which mypy then parsed under 3.10 rules
      # and rejected. Check the floor on the floor.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  # Real compilation, on every push. Tectonic is a single binary and installs
  # in seconds, so there is no excuse for not compiling a real document on each
  # change -- two of this project's worst historical bugs were only ever
  # visible in a real compile.
  latex:
    name: real compile (tectonic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - name: Install Tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version
      # Tectonic fetches TeX packages on demand. On a cold runner those fetches
      # land inside the first test's compile and fail it -- so warm the cache
      # first, and warm it with the *real* rendered template.
      #
      # A toy \documentclass{article} is not good enough: it caches only what
      # that document needs, leaving cmap, geometry, hyperref, titlesec and the
      # rest to be fetched during the first real compile. That is exactly what
      # happened -- the first two integration tests failed with "produced no
      # PDF (exit code 1)" while tests 3-9, running against a by-then-populated
      # cache, all passed.
      #
      # Rendering through the project also means a template that cannot compile
      # fails here, attributed, rather than as an opaque error inside pytest.
      - name: Warm the Tectonic package cache with the real template
        run: |
          mkdir -p /tmp/warm
          # The .tex is written from Python rather than by redirecting stdout.
          # Loading the repositories emits structured log lines on stdout, and
          # redirecting put them at the top of the file -- "warm.tex:1: LaTeX
          # Error: Missing \begin{document}". Writing the file directly is
          # immune to anything else the process decides to print.
          python - <<'PY'
          import pathlib

          from resume_tailor.core.config import Settings
          from resume_tailor.data.bank_repo import BankRepository
          from resume_tailor.data.profile_repo import ProfileRepository
          from resume_tailor.render.engines.fake import FakeEngine
          from resume_tailor.services.resume_service import ResumeService

          s = Settings(pdf_engine="fake")
          svc = ResumeService(
              settings=s,
              bank_repo=BankRepository(s.bank_path),
              profile_repo=ProfileRepository(s.profile_path),
              engine=FakeEngine(),
          )
          keys = list(svc.bank().visible())[:4]
          tex = svc.render_preview(svc.build_spec(keys, max_pages=2))[0]
          out = pathlib.Path("/tmp/warm/warm.tex")
          out.write_text(tex, encoding="utf-8")
          print(f"wrote {out} ({len(tex)} chars)")
          PY
          cd /tmp/warm
          head -c 120 warm.tex; echo
          # -F: match the literal string. As a regex, the backslash and braces
          # need escaping that differs between grep dialects, and getting it
          # subtly wrong fails the step on a perfectly good file.
          grep -qF '\begin{document}' warm.tex
          # Two attempts: the bundle CDN is a network dependency, and a single
          # transient fetch failure should not redden the whole run.
          time tectonic --untrusted --chatter minimal warm.tex \
            || tectonic --untrusted --chatter minimal warm.tex
          test -f warm.pdf
      - run: pytest -m "integration or latex" -v

  # The full TeX Live path, matching the production container. Slower, so it
  # runs nightly and on tags rather than on every push.
  texlive:
    name: real compile (texlive)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - run: pip install -e ".[dev,ui]"
      - run: pytest -m "integration or latex" -v
        env:
          RT_PDF_ENGINE: pdflatex

  # Coverage proves a line ran; mutation proves an assertion would have caught
  # it being wrong. Scoped to domain/ (escaping and matching), where a defect
  # is silent -- it produces a plausible resume rather than an error.
  #
  # Nightly rather than per-push because it is minutes, not seconds, and
  # Linux-only because mutmut does not support native Windows
  # (boxed/mutmut#397), which is why it cannot be run on this project's
  # development machine.
  mutation:
    name: mutation (domain)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # A hard ceiling, because mutation testing has no natural one: cost scales
    # with mutants x test-suite runtime, and a careless config can burn an
    # afternoon of Actions minutes before anyone notices. If this job hits the
    # limit, the config is wrong -- narrow the scope rather than raise the cap.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ui,mutation]"
      - name: Mutate the domain modules
        run: mutmut run --max-children 4
      - name: Report surviving mutants
        if: always()
        run: mutmut results

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.api -t resume-tailor-api .
      - run: docker build -f docker/Dockerfile.ui -t resume-tailor-ui .
      - name: Smoke-test the API image end to end
        run: |
          docker run -d --name api -p 8000:8000 resume-tailor-api
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health/ready | tee /dev/stderr | grep -q '"ready":true'
          # A real compile inside the image, proving the toolchain is present.
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/resume/generate \
            -H 'Content-Type: application/json' \
            -d '{"selected_project_keys":["credit_default"],"max_pages":2}' \
            | tee /dev/stderr | grep -q '"engine":"pdflatex"'
          docker rm -f api
